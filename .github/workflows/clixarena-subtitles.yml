name: CLIXARENA subtitles
run-name: ${{ inputs.mode == 'select' && 'Subtitle selection' || 'CLIXARENA subtitles' }} · ${{ inputs.request_id || 'manual' }}
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [extract, transcribe, select]
        default: extract
      subtitle_tracks:
        description: 'ask (website), all, or subtitle track numbers (0,1)'
        default: ask
      media_url:
        description: HTTPS source URL (blank uses secret)
        required: false
      output_name:
        default: subtitles
      audio_track:
        default: auto
      language:
        default: auto
      model:
        type: choice
        options: [large-v3, turbo, medium, small]
        default: large-v3
      sample_only:
        type: boolean
        default: false
      start_seconds:
        default: '0'
      request_id:
        required: false
permissions:
  contents: read
  actions: read
jobs:
  selection:
    if: inputs.mode == 'select'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Save chosen subtitle tracks
        run: python3 scripts/subtitle_selection.py select
      - uses: actions/upload-artifact@v4
        with:
          name: subtitle-selection-${{ inputs.request_id }}
          path: selection.json
          compression-level: 0
          retention-days: 1
  subtitles:
    if: inputs.mode != 'select'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      PYTHONUNBUFFERED: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      WHISPER_CACHE: /home/runner/.cache/clixarena-whisper
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media tools
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Install speech runtime (new subtitles only)
        if: inputs.mode == 'transcribe'
        run: python -m pip install --disable-pip-version-check -r requirements-subtitles.txt
      - uses: actions/cache@v4
        if: inputs.mode == 'transcribe'
        with:
          path: /home/runner/.cache/clixarena-whisper
          key: clixarena-whisper-${{ runner.os }}-1.2.1-${{ inputs.model }}
      - name: Read embedded subtitle tracks (one track extracts automatically)
        id: tracks
        if: inputs.mode == 'extract'
        run: python scripts/subtitle_selection.py prepare
        env:
          SUBTITLE_MEDIA_URL: ${{ secrets.SUBTITLE_MEDIA_URL }}
      - name: Publish subtitle list for the website
        if: steps.tracks.outputs.waiting == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-tracks-${{ github.run_id }}
          path: subtitle-tracks.json
          compression-level: 0
          retention-days: 1
      - name: Waiting for you to tick subtitle tracks in the website
        if: steps.tracks.outputs.waiting == 'true'
        run: python scripts/subtitle_selection.py wait
        env:
          SUBTITLE_MEDIA_URL: ${{ secrets.SUBTITLE_MEDIA_URL }}
          GH_TOKEN: ${{ github.token }}
      - name: Create new subtitles from audio
        if: inputs.mode == 'transcribe'
        run: python scripts/subtitle_job.py
        env:
          SUBTITLE_MEDIA_URL: ${{ secrets.SUBTITLE_MEDIA_URL }}
      - name: Download subtitles and extraction report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: clixarena-subtitles-${{ github.run_id }}
          path: generated-subtitles/
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove temporary media
        if: always()
        run: python -c "from pathlib import Path; import shutil; p=Path('.subtitle-work').resolve(); assert p.parent == Path.cwd().resolve(); shutil.rmtree(p, ignore_errors=True)"
